[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enhanced_router"
version = "0.1.0"
description = "Loopback model router for Claude Enhanced"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "mcp>=1.27,<2",
    "PyYAML>=6.0,<7",
    "keyring>=25.0,<26",
    "uvicorn>=0.34,<1",
    "litellm[proxy]==1.93.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9", "pytest-asyncio>=0.25,<1", "pytest-cov>=6.0,<7"]

[tool.setuptools.packages.find]
where = ["router"]
include = ["enhanced_router*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "router", "hooks"]

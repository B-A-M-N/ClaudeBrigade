  # Logical FreeInference models. Endpoint selection defaults to the
  # highest token-weighted cache-read rate once enough evidence exists.
  diffusiongemma:
    display_name: DiffusionGemma fastpath via FreeInference
    provider_id: freeinference
    backend: litellm
    litellm_model: openai/diffusiongemma
    api_base: https://freeinference.org/v1
    api_key_env: FREEINFERENCE_API_KEY
    capabilities: {tools: false, mutation: false, reasoning: low, local: false, controller_eligible: false, openai_chat_completions: true, streaming: false, read_tool_certified: false, write_tool_certified: false}
    allowed_roles: []

  glm-5.1:
    display_name: GLM-5.1 via FreeInference
    provider_id: freeinference
    backend: litellm
    litellm_model: openai/glm-5.1
    api_base: https://freeinference.org/v1
    api_key_env: FREEINFERENCE_API_KEY
    endpoint_policy: {mode: highest-cache-rate, default_endpoint: openai, minimum_requests: 5, minimum_input_tokens: 50000}
    endpoints:
      openai:
        backend: litellm
        provider_id: freeinference
        protocol: openai-chat
        litellm_model: openai/glm-5.1
        api_base: https://freeinference.org/v1
        api_key_env: FREEINFERENCE_API_KEY
        certified: false
      anthropic:
        backend: direct-anthropic
        provider_id: freeinference
        protocol: anthropic-messages
        upstream_model: glm-5.1
        api_base: https://freeinference.org/anthropic
        api_key_env: FREEINFERENCE_API_KEY
        auth: {type: bearer, header: Authorization, prefix: "Bearer "}
        certified: false
    capabilities: {tools: true, mutation: true, reasoning: high, local: false, controller_eligible: true, anthropic_messages: true, openai_chat_completions: true, tool_calls: true, prompt_cache: true, read_tool_certified: true, write_tool_certified: true, max_output_tokens: 131072}
    allowed_roles: [recon, implementer, adversary, repairer]


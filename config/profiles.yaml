profiles:
  freeinference:
    controller_model: glm-5.1
    recon: qwen3.6-35b
    implementer: kimi-k2.7-code
    adversary: glm-5.1
    repairer: glm-5-turbo
    slots:
      main: {model: glm-5.1, reserve_class: controller}
      sonnet: {model: kimi-k2.7-code, reserve_class: worker}
      haiku: {model: qwen3.6-35b, reserve_class: worker}
      opus: {model: glm-5.1, reserve_class: worker}
      fable: {model: glm-5.1, reserve_class: critical}
      background: {model: deepseek-v4-flash, reserve_class: optional}
    agents:
      grounder:
        template: brigade-grounder
        slot: haiku
        roles: [recon, grounding]
        tools: [Read, Grep, Glob, Bash]
        disallowed_tools: [Edit, Write, NotebookEdit, Agent, Workflow]
        background: true
        max_turns: 60
        effort: medium
      implementer:
        template: brigade-implementer
        slot: sonnet
        roles: [implementer]
        tools: [Read, Grep, Glob, Bash, Edit, Write]
        isolation: worktree
        can_mutate: true
        counts_as_implementation: true
        background: true
        max_turns: 140
        effort: high
        permission_mode: acceptEdits
      reviewer:
        template: brigade-reviewer
        slot: opus
        roles: [adversary]
        tools: [Read, Grep, Glob, Bash]
        disallowed_tools: [Edit, Write, NotebookEdit, Agent, Workflow]
        background: true
        max_turns: 100
        effort: high
      repairer:
        template: brigade-repairer
        slot: opus
        roles: [repairer]
        tools: [Read, Grep, Glob, Bash, Edit, Write]
        isolation: worktree
        can_mutate: true
        counts_as_implementation: true
        background: true
        max_turns: 120
        effort: high
        permission_mode: acceptEdits
      critical-architect:
        template: brigade-critical-architect
        slot: fable
        roles: [architect, adjudicator]
        tools: [Read, Grep, Glob, Bash]
        disallowed_tools: [Edit, Write, NotebookEdit, Agent, Workflow]
        background: true
        max_turns: 100
        effort: high
      fast-verifier:
        template: brigade-fast-verifier
        slot: haiku
        roles: [verification]
        tools: [Read, Grep, Glob, Bash]
        disallowed_tools: [Edit, Write, NotebookEdit, Agent, Workflow]
        background: true
        max_turns: 60
        effort: medium
      critical-verifier:
        template: brigade-critical-verifier
        slot: fable
        roles: [verification]
        tools: [Read, Grep, Glob, Bash]
        disallowed_tools: [Edit, Write, NotebookEdit, Agent, Workflow]
        background: true
        max_turns: 100
        effort: high
    specialists:
      fast-scout:
        model: qwen3.6-35b
        roles: [recon]
        latency_class: fast
        template: brigade-grounder
        native_agent_name: brigade-sidecar-scout
        public_model_alias: anthropic-brigade-sidecar-scout
      broad-architect:
        model: minimax-m3
        roles: [recon, adversary]
        activation: long_context_or_multimodal
        launchable: false
      coding-implementer:
        model: kimi-k2.7-code
        roles: [implementer]
        template: brigade-implementer
        native_agent_name: brigade-sidecar-coding-worker
        public_model_alias: anthropic-brigade-sidecar-coding-worker
      correctness-reviewer:
        model: glm-5.1
        roles: [adversary]
        template: brigade-reviewer
        native_agent_name: brigade-sidecar-correctness-reviewer
        public_model_alias: anthropic-brigade-sidecar-correctness-reviewer
      fast-repairer:
        model: glm-5-turbo
        roles: [repairer]
        template: brigade-repairer
        native_agent_name: brigade-sidecar-fast-repairer
        public_model_alias: anthropic-brigade-sidecar-fast-repairer

  longcat:
    controller_model: longcat-2
    recon: longcat-2
    implementer: longcat-2
    adversary: longcat-2
    repairer: longcat-2

  local-first:
    controller_model: qwen-local
    recon: qwen-local
    implementer: qwen-local
    adversary: glm-5.1
    repairer: qwen-local

  hybrid:
    controller_model: glm-5.1
    recon: qwen-local
    implementer: glm-5.1
    adversary: glm-5.1
    repairer: glm-5-turbo

  nvidia-nim:
    controller_model: nvidia-nim-free
    recon: nvidia-nemotron-3-ultra
    implementer: nvidia-nemotron-3-ultra
    adversary: nvidia-llama-3.1-405b
    repairer: nvidia-llama-3.1-70b

  opencode-zen:
    controller_model: opencode-zen-free
    recon: opencode-zen-sonnet
    implementer: opencode-zen-sonnet
    adversary: opencode-zen-opus
    repairer: opencode-zen-haiku

  opencode-go:
    controller_model: opencode-go-sonnet
    recon: opencode-go-sonnet
    implementer: opencode-go-sonnet
    adversary: opencode-go-opus
    repairer: opencode-go-sonnet

  kilocode-free:
    controller_model: kilocode-auto-free
    recon: kilocode-deepseek-v3
    implementer: ling-3.0-flash
    adversary: kilocode-mistral-nemo
    repairer: kilocode-llama-3.1-8b

  openrouter-free:
    controller_model: openrouter-free
    recon: glm-5.1
    implementer: glm-5.1
    adversary: glm-5.1
    repairer: glm-5-turbo

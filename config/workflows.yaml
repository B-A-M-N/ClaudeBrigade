          kind: phase_result_equals
          phase_id: post-grounding
          field: complexity
          value: COMPLEX
        result_contract:
          schema_id: minimax_senior_review_v1
          success_verdicts: [PASS, NO_FINDINGS]
          failure_verdicts: [BLOCKED]
          requires_current_generation: true
          requires_current_digest: true
      - id: repair
        agent_id: repairer
        execution_kind: native_agent
        roles: [repairer]
        required: false
        mutation: true
        depends_on: [native-review, senior-review]
        conditional: accepted_findings
      - id: post-repair-grounding
        sidecar_agent: grounder
        execution_kind: native_agent
        roles: [recon]
        required: false
        depends_on: [repair]
        conditional: accepted_findings
        result_contract:
          schema_id: qwen_grounding_v1
          success_verdicts: [PASS]
          failure_verdicts: [BLOCKED]
          requires_current_generation: true
          requires_current_digest: true
      - id: completion-controller
        sidecar_agent: completion-controller
        execution_kind: native_agent
        roles: [adjudicator]
        depends_on: [post-repair-grounding]
        result_contract:
          schema_id: kimi_completion_v1
          success_verdicts: [COMPLETED]
          branch_verdicts: [NEEDS_REVIEW]
          failure_verdicts: [BLOCKED]
          branch_field: completion
          branches: {COMPLETED: native-critical-review, NEEDS_REVIEW: completion-review}
          requires_current_generation: true
          requires_current_digest: true
      - id: completion-review
        sidecar_agent: completion-reviewer
        execution_kind: native_agent
        roles: [adversary]
        required: false
        depends_on: [completion-controller]
        condition:
          kind: phase_result_equals
          phase_id: completion-controller
          field: completion
          value: NEEDS_REVIEW
        result_contract:
          schema_id: minimax_completion_review_v1
          success_verdicts: [COMPLETED]
          branch_verdicts: [NEEDS_REVIEW]
          failure_verdicts: [BLOCKED]
          requires_current_generation: true
          requires_current_digest: true
      - id: correction

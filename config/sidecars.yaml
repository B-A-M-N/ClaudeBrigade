coprocessors:
  post-edit-sentinel:
    model_id: diffusiongemma
    mode: sentinel
    timeout_seconds: 2
    max_packet_bytes: 32000
    max_output_tokens: 256
    output_schema_id: sentinel_v1
    input_schema_id: feedback_packet_v1
    prompt_version: post-edit-sentinel-v1
    capability_contract_version: feedback-v1
    supported_task_classes: [trivial, normal, cross-cutting, high-risk]
    supported_artifact_types: [source, configuration, tests, migrations]
    required_evidence: [task_contract, evidence_manifest, workspace_digest]
    maximum_diff_lines: 400
    maximum_context_tokens: 12000
    abstention_required_when_incomplete: true
    minimum_confidence: 0.60
    system_prompt: >-
      You are a bounded post-edit sentinel. You are advisory evidence only;
      you cannot authorize mutation, review, escalation, integration, or
      completion. Inspect only the supplied task contract, risk signals,
      changed files, bounded diff, and evidence manifest. Do not infer facts
      that are absent or truncated. Return ONLY this JSON object: alert must
      be one of none, watch, escalate; why must be one concise observation
      grounded in an evidence reference; suggested_next must be one of
      re_ground, invoke_minimax, invoke_controller, invoke_glm, proceed, or
      none; confidence must be between 0 and 1; evidence_refs must contain
      only keys present in evidence_manifest. suggested_next is a hypothesis,
      never an instruction. Prefer none when evidence is incomplete.

  route-advisor:
    model_id: diffusiongemma
    mode: route
    timeout_seconds: 5
    max_packet_bytes: 64000
    max_output_tokens: 1024
    system_prompt: >-
      Classify conservatively and return only the requested JSON. You are
      advisory and cannot lower the deterministic workflow tier, choose a
      physical endpoint, mutate files, or authorize completion.

  verification-reviewer:
    model_id: glm-5.1
    mode: verify
    timeout_seconds: 45
    max_packet_bytes: 64000
    max_output_tokens: 2048
    output_schema_id: feedback_v1
    prompt_version: verification-review-v1
    capability_contract_version: feedback-v1
    supported_task_classes: [trivial, normal, cross-cutting, high-risk]
    supported_artifact_types: [source, configuration, tests, migrations]
    required_evidence: [task_contract, evidence_manifest, workspace_digest]
    maximum_diff_lines: 400
    maximum_context_tokens: 12000
    abstention_required_when_incomplete: true
    system_prompt: >-
      Review only the bounded evidence packet and return feedback_v1 JSON with
      decision (continue, repair, escalate, or insufficient_evidence), findings
      (id, severity, claim, evidence_refs, required_action, confidence),
      unknowns, and needs_more_evidence. Use only evidence manifest keys.
      Return no prose. Your result is advisory until accepted by the controller.

feedback_monitor:
  # The hook checks this policy locally after each tool batch. A provider call
  # is made only for a fresh checkpoint, never for every MCP event.
  enabled: true
  coprocessor_id: post-edit-sentinel
  checkpoints: [post_edit_checkpoint]
  watched_tools: [Edit, Write, NotebookEdit, Bash]
  cooldown_seconds: 15
  # One sentinel per mutating execution keeps the signal at the phase
  # boundary budget instead of turning every edit into another model call.
  max_calls_per_execution: 1
  max_parallelism: 1
  wait_seconds: 2
  required: false

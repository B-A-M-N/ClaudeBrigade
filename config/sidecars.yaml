# Master switch for launches that do not select a named sidecar profile.
# A named profile can apply its own narrower `coprocessors_enabled` switch.
# This affects bounded router-owned calls only; native sidecar agents and
# fastpath retain independent enablement controls.
coprocessors_enabled: true

# Native Claude Code workers selected independently from the role profile.
# They receive their tools and backing model through the --agents manifest;
# they never run through CoprocessorExecutor.
sidecar_agents:
  qwen-grounder:
    worker_id: grounder
    model_id: qwen3.6-35b
    native_agent_name: brigade-sidecar-grounder
    public_model_alias: anthropic-brigade-sidecar-grounder
    roles: [recon, grounding]
    description: Checks assumptions, scope adherence, and missing requirements
    template: brigade-grounder
    tools: [Read, Grep, Glob, Bash]
    can_mutate: false
    isolation: none
    background: true
    max_turns: 60
    effort: medium
    max_parallelism: 2

